# Minimal, reproducible local smoke test for T2.2.4 (CPU-only, no gating, no GPU).
# Small open-weight model pulled from the Hugging Face Hub on first run.
# Run from the framework/ directory:
#   uv sync --extra local
#   uv run python -m riddles_framework.cli --config configs/local_cpu_smoke.yaml
# Then check that results.jsonl rows have "generation_status": "success".

runner_name: smoke

dataset_path: ../data_loading/pilot_dataset/smoke_test_25.jsonl
dataset_version: smoke_test_25

prompt_template_id: riddle_master
prompt_template_version: v1
prompt_language: eng
riddle_language_presented: source
is_hint_provided: false

reasoning_mode: null
search_enabled: false
batch_mode: false
batch_size: 1

temperature: null
max_output_tokens: 16
seed: 0

model_params:
  model_load:
    # Force CPU so the smoke test is deterministic and GPU-independent.
    device_map: cpu
    dtype: float32

cache_enabled: false

api_key_env_var: null
base_url: null

runner_version: v1.0.0
notes: CPU smoke test, small ungated HF model, non-cached path
strict_capability_check: true

model_spec:
  model_name: qwen2.5-0.5b-instruct
  model_id: local/qwen2.5-0.5b-instruct
  provider: local
  access_pattern: local
  provider_model_name: Qwen/Qwen2.5-0.5B-Instruct
  closed_source: false
  notes: small open-weight model, ~0.5B params, ungated
  capabilities:
    supports_reasoning: false
    supports_search: false
    supports_structured_output: false
    supports_batch: true
    supports_seed: true
