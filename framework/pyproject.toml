[project]
name = "riddles-framework"
version = "0.1.0"
description = "Benchmark framework for the Multicultural Riddles project (T2.2.1)"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "openai>=1.30.0",
  "anthropic>=0.34.0",
  "google-genai>=0.3.0",
  "together>=1.3.0",
  "cachesaver==0.0.6",
]

[project.optional-dependencies]
local = [
  "transformers>=4.41.0",
  "torch>=2.2.0",
  "accelerate>=0.33.0",
]

[project.scripts]
riddles-framework = "riddles_framework.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riddles_framework = ["prompt_templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
